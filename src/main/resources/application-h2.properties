# PathForge Application Properties (H2 Standalone Profile)
spring.application.name=PathForge
server.port=8080

spring.datasource.url=jdbc:h2:mem:pathforgedb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

pathforge.jwt.secret=PathForgeSuperSecretKeyForBTechMajorProjectGuidancePlatform2026SecureToken
pathforge.jwt.expiration-ms=86400000

logging.level.com.pathforge=INFO
