# PathForge Application Properties
spring.application.name=PathForge
server.port=8080

# Database Configuration (MySQL Primary, H2 Fallback ready)
spring.datasource.url=jdbc:mysql://localhost:3306/pathforge_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security / JWT Secret Key
pathforge.jwt.secret=PathForgeSuperSecretKeyForBTechMajorProjectGuidancePlatform2026SecureToken
pathforge.jwt.expiration-ms=86400000

# File Upload Max Size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging Configuration
logging.level.com.pathforge=INFO
logging.level.org.springframework.web=INFO
