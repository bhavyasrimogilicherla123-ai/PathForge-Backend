# PathForge Application Properties (Production & Development)
spring.application.name=PathForge

# Server Port (Render provides $PORT environment variable, default to 8080)
server.port=${PORT:8080}

# Database Configuration (Reads from environment variables, fallback to local MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/pathforge_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# CORS Allowed Origins (Comma-separated origins or patterns, supports Vercel domains and local dev)
pathforge.cors.allowed-origins=${PATHFORGE_CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5500,http://127.0.0.1:5500,https://pathforge-frontend-wheat.vercel.app,https://*.vercel.app}
server.error.include-message=always

# H2 Console (Disabled in production unless profile activated)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security / JWT Secret Key (Configurable via environment variable)
pathforge.jwt.secret=${PATHFORGE_JWT_SECRET:PathForgeSuperSecretKeyForBTechMajorProjectGuidancePlatform2026SecureToken}
pathforge.jwt.expiration-ms=${PATHFORGE_JWT_EXPIRATION_MS:86400000}

# File Upload Max Size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging Configuration
logging.level.com.pathforge=INFO
logging.level.org.springframework.web=INFO
